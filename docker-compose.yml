services:
  postgres:
    image: postgres:16-alpine
    container_name: pandora-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: pandora
      POSTGRES_USER: pandora
      POSTGRES_PASSWORD: pandora
    volumes:
      - pandora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandora -d pandora"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pandora-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: PANDORA
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: pandora
      DB_USERNAME: pandora
      DB_PASSWORD: pandora
      SESSION_DRIVER: file
      VITE_DEV_SERVER_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  vite:
    image: node:22-alpine
    container_name: pandora-vite
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - pandora-node-modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  pandora-vendor:
  pandora-node-modules:
  pandora-pgdata:
