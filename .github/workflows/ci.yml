name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  compliance-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Start services using Docker Compose
      run: docker compose -f docker-compose.yml up -d postgres app

    - name: Wait for PostgreSQL
      run: sleep 10 # Aseguramos que la bd esté lista (idealmente con un ping)

    - name: Install Dependencies
      run: docker compose exec -T app composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Copy .env
      run: cp .env.example .env

    - name: Generate Application Key
      run: docker compose exec -T app php artisan key:generate

    - name: Run Migrations
      run: docker compose exec -T app php artisan migrate --force

    - name: Execute Compliance Suite
      run: docker compose exec -T app php artisan test --filter Compliance

  deploy:
    needs: compliance-audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production
      run: echo "Despliegue a producción en progreso... (Bloqueado si compliance-audit falla)"
      # Aquí iría el script real de despliegue (ej. rsync, ssh, AWS, etc.)
