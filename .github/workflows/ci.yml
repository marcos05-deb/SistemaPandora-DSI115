name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  compliance-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Environment
      run: cp .env.example .env

    - name: Fix Directory Permissions for Docker
      run: sudo chown -R 1000:1000 .

    - name: Start services using Docker Compose
      run: docker compose -f docker-compose.yml up -d postgres app

    - name: Wait for App Initialization
      run: |
        echo "Waiting for app container to finish entrypoint.sh (composer, migrate, etc)..."
        timeout 180 bash -c 'until docker compose logs app | grep -q "Server running on"; do sleep 5; done'
        echo "App is fully initialized!"

    - name: Execute Compliance Suite
      run: docker compose exec -T app php artisan test --filter Compliance

  deploy:
    needs: compliance-audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production
      run: echo "Despliegue a producción en progreso... (Bloqueado si compliance-audit falla)"
      # Aquí iría el script real de despliegue (ej. rsync, ssh, AWS, etc.)
