# Producción / demo sin Vite en caliente (usa assets ya compilados en public/build)
services:
  postgres:
    image: postgres:16-alpine
    container_name: pandora-postgres
    environment:
      POSTGRES_DB: pandora
      POSTGRES_USER: pandora
      POSTGRES_PASSWORD: pandora
    volumes:
      - pandora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandora -d pandora"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pandora-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - pandora-vendor:/var/www/html/vendor
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: pandora
      DB_USERNAME: pandora
      DB_PASSWORD: pandora
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  pandora-vendor:
  pandora-pgdata:
